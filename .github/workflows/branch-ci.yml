name: Branch baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - name: Browser ELK worker smoke
        run: |
          pnpm exec vp dev --host 127.0.0.1 --port 5173 >/tmp/branch-vite.log 2>&1 &
          server=$!
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/branch-chrome about:blank >/tmp/chrome.log 2>&1 &
          chrome=$!
          trap 'kill "$server" "$chrome" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/elk-layout-smoke.html >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let pages;
          for (let i = 0; i < 50; i++) {
            try {
              pages = await fetch("http://127.0.0.1:9222/json/list").then((r) => r.json());
              if (pages.some((page) => page.type === "page")) break;
            } catch { /* Chrome still starting. */ }
            await sleep(100);
          }
          const page = pages?.find((entry) => entry.type === "page");
          if (!page) throw new Error("Chrome debugging target did not start");
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener("open", resolve, { once: true });
            ws.addEventListener("error", reject, { once: true });
          });
          let id = 0;
          const callbacks = new Map();
          ws.addEventListener("message", (event) => {
            const payload = JSON.parse(event.data);
            if (payload.method === "Runtime.exceptionThrown") {
              console.error("Chrome script exception:", JSON.stringify(payload.params));
            }
            const done = callbacks.get(payload.id);
            if (done) { callbacks.delete(payload.id); done(payload); }
          });
          const rpc = (method, params = {}) => new Promise((resolve) => {
            const call = ++id;
            callbacks.set(call, resolve);
            ws.send(JSON.stringify({ id: call, method, params }));
          });
          await rpc("Page.enable");
          await rpc("Runtime.enable");
          await rpc("Page.navigate", { url: "http://127.0.0.1:5173/elk-layout-smoke.html" });
          const deadline = Date.now() + 20_000;
          while (Date.now() < deadline) {
            await sleep(200);
            const response = await rpc("Runtime.evaluate", {
              expression: 'document.querySelector("#status")?.textContent',
              returnByValue: true
            });
            const state = response.result?.result?.value ?? "";
            if (state.startsWith("ELK_PASS")) { console.log(state); ws.close(); process.exit(0); }
            if (state.startsWith("ELK_FAIL")) { throw new Error(state); }
          }
          throw new Error("Browser layout never resolved in 20 seconds");
          NODE
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
