name: Branch baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm exec vp fmt . --write && git diff -- scripts/check-native-dialogs.mjs src/components/ui/TemplateGalleryLoading.test.tsx src/templates/index.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
