name: Branch baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm exec vp check --fix; git diff -- scripts/check-native-dialogs.mjs src/components/ui/ConfirmDialog.tsx src/components/panels/FlowsPanel.test.tsx src/components/ui/ConfirmDialog.test.tsx src/components/ui/TemplateGalleryDialog.tsx src/utils/layout.ts src/utils/layout/elk.ts src/templates/index.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
