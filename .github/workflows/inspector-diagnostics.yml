name: Temporary inspector diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture normalized source and tests
        run: |
          pnpm exec vp fmt . --write
          echo '===BEGIN_FORMAT_DIFF==='
          git diff -- src/components/panels/PropertiesPanel.tsx src/components/panels/InspectorTabs.tsx
          echo '===END_FORMAT_DIFF==='
          pnpm check || true
          pnpm test:run || true
          pnpm build || true
